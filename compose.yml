# space-elevator compose stack for the omni-sync server.
#
# A repo that ships its own compose file wins over synthesized builds, so this
# is what `space-elevator apps upload <dir>` parses. Named volumes are managed
# by the platform (`se-vol-<app-id>-<hash>`), so the SQLite state and the chunk
# store survive redeploys.
services:
  web:
    build: .
    # Bare port spec: the platform publishes it and Traefik discovers the
    # container port. Port 80 is the one space-elevator's rootful Traefik
    # reaches for a host-published web app; do not hard-code a host port.
    ports:
      - "80"
    # A self-update writes the verified binary to /state/bin and exits; the
    # restart policy picks it up through docker-entrypoint.sh.
    restart: unless-stopped
    volumes:
      - omnidata:/data
      - omnistate:/state
    environment:
      OMNI_SYNC_ADDR: "0.0.0.0:80"
      OMNI_SYNC_DATA_DIR: "/data"
      OMNI_SYNC_STATE_DIR: "/state"
      # Only needed if the GitHub repo is private, for `omni-sync-server
      # update` to read the release. The repo is public, so this is unset.
      OMNI_SYNC_GITHUB_TOKEN: "${OMNI_SYNC_GITHUB_TOKEN:-}"

volumes:
  omnidata:
  omnistate:
