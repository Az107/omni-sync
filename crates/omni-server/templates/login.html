{% extends "base.html" %}
{% block title %}Log in · omni-sync{% endblock %}
{% block body %}
<div class="gate">
  <form class="gate-card" method="post" action="/login">
    <a class="brand" href="/">
      <svg class="mark" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
        <rect x="1" y="1" width="7" height="7" rx="1.5"/>
        <rect x="10" y="1" width="7" height="7" rx="1.5"/>
        <rect x="1" y="10" width="7" height="7" rx="1.5"/>
        <rect class="mark-accent" x="10" y="10" width="7" height="7" rx="1.5"/>
      </svg>
      omni-sync
    </a>
    <p class="page-note">Sign in to manage devices, folders and overwrites. Server {{ version }}.</p>
    {% if let Some(message) = error %}
      <p class="error">{{ message }}</p>
    {% endif %}
    <div class="gate-form">
      <label for="password">Dashboard password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
