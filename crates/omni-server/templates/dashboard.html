<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>omni-sync</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="bar">
    <span class="brand">omni-sync</span>
    <nav><a href="/">overview</a></nav>
    <form method="post" action="/logout"><button type="submit">log out</button></form>
  </header>

  <main>
    <h1>Overview</h1>
    <p class="muted">server {{ version }}</p>

    <div class="cards">
      <section class="card">
        <h2>{{ devices }}</h2>
        <p>devices enrolled</p>
      </section>
      <section class="card">
        <h2>{{ folders }}</h2>
        <p>shared folders</p>
      </section>
    </div>

    <p class="muted">
      M0 scaffold: enrollment is live. Folders, file history and the overwrite
      queue land in M2–M4.
    </p>
  </main>
</body>
</html>
