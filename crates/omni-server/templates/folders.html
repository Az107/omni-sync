<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>omni-sync · folders</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="bar">
    <span class="brand">omni-sync</span>
    <nav>
      <a href="/">overview</a>
      <a href="/devices">devices</a>
      <a href="/folders">folders</a>
      <a href="/overwrites">overwrites</a>
    </nav>
    <form method="post" action="/logout"><button type="submit">log out</button></form>
  </header>

  <main>
    <h1>Folders</h1>

    <form method="post" action="/folders" class="inline">
      <input name="name" placeholder="folder name" required>
      <button type="submit">Create</button>
    </form>

    <table>
      <thead><tr><th>name</th><th>id</th></tr></thead>
      <tbody>
      {% for folder in folders %}
        <tr><td>{{ folder.name }}</td><td class="mono">{{ folder.id }}</td></tr>
      {% endfor %}
      </tbody>
    </table>
    <p class="muted">Clients join with <code>omni-sync add &lt;id&gt; &lt;path&gt;</code>.</p>
  </main>
</body>
</html>
