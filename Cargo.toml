[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Az107/omni-sync"

[workspace.dependencies]
# Internal crates.
omni-agent = { path = "crates/omni-agent", version = "0.4.1" }
omni-chunk = { path = "crates/omni-chunk", version = "0.4.1" }
omni-core = { path = "crates/omni-core", version = "0.4.1" }
omni-netproto = { path = "crates/omni-netproto", version = "0.4.1" }
omni-store = { path = "crates/omni-store", version = "0.4.1" }
omni-transfer = { path = "crates/omni-transfer", version = "0.4.1" }
omni-update = { path = "crates/omni-update", version = "0.4.1" }

# External. Versions are the ones the `imp` workspace already builds on this
# host, so most are warm in the registry cache.
anyhow = "1.0"
argon2 = "0.5"
askama = "0.14"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "form",
    "json",
    "query",
] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
hex = "0.4"
inquire = "0.7"
notify = "8"
opener = "0.7"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "sync",
    "io-util",
    "fs",
    "net",
] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
