name: Release

# Tag `client-v0.4.1` or `server-v0.4.1` (or run this manually with a tag) to
# publish that component only: the client builds for linux/macOS/Windows
# (x64 + arm64), the server for linux x64 + arm64. The two version and release
# independently; see AGENTS.md -> Versioning.
on:
  push:
    tags: ["client-v*", "server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. client-v0.4.1). Must already exist.
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # aws-lc-sys would otherwise need NASM on Windows x64. The GitHub Windows
  # image has no NASM; when this is set (and no assembler is found) it links
  # the crate's prebuilt assembly objects instead. It is ignored everywhere
  # except Windows x86-64.
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  # Decide which component the tag is for and which targets to build, so a
  # client release never spends runners rebuilding the server (and vice versa).
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.pick.outputs.component }}
      version: ${{ steps.pick.outputs.version }}
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - id: pick
        run: |
          set -euo pipefail
          python3 scripts/release.py "$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.bin }} ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}

      # One cache per target+package. Without an explicit key every matrix
      # entry would resolve to the same job-based key and they would overwrite
      # each other's target dir.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.package }}

      - run: cargo build --release --locked -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Native regression tests
        if: matrix.native
        run: cargo test --workspace --locked

      # Cross-compiled targets (macOS x64, Windows arm64) cannot be executed
      # on the runner, so only the native ones are smoke-tested.
      - name: Smoke test (unix)
        if: matrix.native && runner.os != 'Windows'
        run: |
          set -euo pipefail
          actual=$(./target/${{ matrix.target }}/release/${{ matrix.bin }} --version)
          test "$actual" = '${{ matrix.bin }} ${{ needs.plan.outputs.version }}'

      - name: Smoke test (windows)
        if: matrix.native && runner.os == 'Windows'
        run: |
          $actual = .\target\${{ matrix.target }}\release\${{ matrix.bin }}.exe --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne '${{ matrix.bin }} ${{ needs.plan.outputs.version }}') {
            throw "Unexpected binary version: $actual"
          }

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          name="${{ matrix.bin }}-${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          stage="$(mktemp -d)"
          install -m 0755 "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$stage/"
          tar -C "$stage" -czf "${name}.tar.gz" "${{ matrix.bin }}"
          # The bare binary is what the self-updater downloads; it needs no
          # archive extraction. Both are published and checksummed.
          install -m 0755 "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${name}"
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_BARE=${name}" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ matrix.bin }}-${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}.exe" `
            -DestinationPath "$name.zip"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}.exe" "$name.exe"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_BARE=$name.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.bin }}-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_BARE }}
          if-no-files-found: error

  publish:
    name: publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Validate all assets and generate checksums
        run: python3 scripts/release.py "$TAG" --dist dist

      - name: Upload draft, verify downloaded assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            test "$draft" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "$TAG" --notes-file docs/releases/hardening.md
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          python3 scripts/release.py "$TAG" --dist downloaded --verify-checksums
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
