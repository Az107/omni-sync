name: Release

# Tag a commit `v0.1.0` (or run this manually with a tag) to attach both
# binaries to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0). Must already exist.
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.bin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: omni-cli
            bin: omni-sync
          - package: omni-server
            bin: omni-sync-server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked -p ${{ matrix.package }}

      - name: Package the tarball
        run: |
          set -euo pipefail
          version="${TAG#v}"
          stage="$(mktemp -d)"
          install -m 0755 "target/release/${{ matrix.bin }}" "$stage/"
          tar -C "$stage" -czf "${{ matrix.bin }}-${version}-linux-x86_64.tar.gz" \
            "${{ matrix.bin }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.bin }}-linux-x86_64
          path: ${{ matrix.bin }}-*-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: publish ${{ github.workflow }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes
          fi
